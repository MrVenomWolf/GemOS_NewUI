<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#171721" stop-opacity="1" />
      <stop offset="55%" stop-color="#07070a" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.16)" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
  </defs>

  <!-- Pure AMOLED Background Card -->
  <rect width="1200" height="320" rx="24" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="240" y1="0" x2="240" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="720" y1="0" x2="720" y2="320" />
    <line x1="960" y1="0" x2="960" y2="320" />
  </g>

  <!-- Blume / GemOS Isometric Hex Cube Emblem -->
  <g transform="translate(600, 96)">
    <rect x="-38" y="-38" width="76" height="76" rx="20" fill="#0b0b0f" stroke="rgba(255,255,255,0.16)" stroke-width="1.5" />
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    <polyline points="-19,-11 0,0 19,-11" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
    <line x1="0" y1="0" x2="0" y2="22" stroke="#ffffff" stroke-width="1.8" />
    <polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.2" />
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="182" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">
    GemOS
  </text>
  <text x="600" y="216" text-anchor="middle" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="17" font-weight="400" letter-spacing="-0.2">
    Minimalist AMOLED Desktop &amp; Web Workbench for Google Gemini
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 262)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" font-size="12" fill="#d4d4d8">
    <g transform="translate(-330, 0)">
      <rect x="-70" y="-15" width="140" height="28" rx="14" fill="#111116" stroke="rgba(255,255,255,0.1)" />
      <circle cx="-52" cy="-1" r="3.5" fill="#30d158" />
      <text x="6" y="3" text-anchor="middle">Live SSE Streaming</text>
    </g>
    <g transform="translate(-165, 0)">
      <rect x="-72" y="-15" width="144" height="28" rx="14" fill="#111116" stroke="rgba(255,255,255,0.1)" />
      <text x="0" y="3" text-anchor="middle">Gemini 4 &amp; 3.x Sync</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-72" y="-15" width="144" height="28" rx="14" fill="#111116" stroke="rgba(255,255,255,0.1)" />
      <text x="0" y="3" text-anchor="middle">Unlimited File Context</text>
    </g>
    <g transform="translate(165, 0)">
      <rect x="-72" y="-15" width="144" height="28" rx="14" fill="#111116" stroke="rgba(255,255,255,0.1)" />
      <text x="0" y="3" text-anchor="middle">Image Generation</text>
    </g>
    <g transform="translate(330, 0)">
      <rect x="-70" y="-15" width="140" height="28" rx="14" fill="#111116" stroke="rgba(255,255,255,0.1)" />
      <text x="0" y="3" text-anchor="middle">SQLite Persistence</text>
    </g>
  </g>
</svg>
